<!doctype html>
<!--
  Sprite3D prototype page (#15): renders a rigged GLB to a 64x64 isometric pixel-art frame.
  Driven by scripts/sprite3d/render.mjs through window.__sprite3d. Served by that script's
  static server, which also maps /models/* and /courier/* to files on disk.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>sprite3d</title>
    <style>
      body {
        margin: 0;
        background: #202020;
      }
      canvas {
        image-rendering: pixelated;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/": "/node_modules/three/"
        }
      }
    </script>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module" src="/scripts/sprite3d/renderer.js"></script>
  </body>
</html>
